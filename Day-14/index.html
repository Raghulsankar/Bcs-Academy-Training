<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Beast task</title>
    <style>
      body {
        background-color: #200302;
        min-height: 100vh;
        display: grid;
        place-content: center;
        margin: 0;
      }
      div {
        text-align: center;
        height: 642px;
        width: 330px;
        border-radius: 29px;
      }
      h2 {
        font-weight: 800;
        color: #ffffff;
        text-align: center;
        font-size: 36px;
        line-height: 100%;
        font-family: "inter";
        margin-top: 5px;
      }
      p {
        color: #d6bbba;
        font-family: "poppins";
        text-align: center;
        font-size: 13px;
        line-height: 1.7;
        font-weight: 400;
      }
      .dot {
        color: #ffffff;
      }
      .releaseDate {
        color: #997877;
        font-family: "inter";
        font-weight: 400;
        font-size: 12px;
        line-height: 100%;
        margin-top: 5px;
      }
      img {
        border-radius: 29px;
        object-fit: cover;
        width: 330px;
        height: 442px;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="./images/beast.png" />
      <h2>Beast</h2>
      <p class="releaseDate">
        2022 <span class="dot">.</span> Action/Dark Comedy
        <span class="dot">.</span> 2h 38m
      </p>
      <p>
        Beast is an upcoming Indian Tamil-language action thriller film written
        and directed by Nelson and produced by Sun Pictures. The film stars
        Vijay and Pooja Hegde, while Selvaraghavan, Yogi Babu and Redin Kingsley
        play supporting roles
      </p>
    </div>
  </body>
</html>
