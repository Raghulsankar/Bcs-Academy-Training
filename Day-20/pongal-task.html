<!-- use the callback hell pattern print reverse order 10 t0 1 and display happy pongal. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0;
        display: grid;
        place-content: center;
        min-height: 100vh;

        font-family: sans-serif;
      }

      h1 {
        font-size: 4rem;
      }
    </style>
  </head>
  <body>
    <h1>10</h1>

    <script>
      //  Your code - Use Callback hell pattern

      //   const display = document.querySelector("h1");
      //   const value = display.innerHTML;
      //   console.log(value);

      setTimeout(() => {
        document.querySelector("h1").innerText = 9;
        setTimeout(() => {
          document.querySelector("h1").innerText = 8;
          setTimeout(() => {
            document.querySelector("h1").innerText = 7;
            setTimeout(() => {
              document.querySelector("h1").innerText = 6;
              setTimeout(() => {
                document.querySelector("h1").innerText = 5;
                setTimeout(() => {
                  document.querySelector("h1").innerText = 4;
                  setTimeout(() => {
                    document.querySelector("h1").innerText = 3;
                    setTimeout(() => {
                      document.querySelector("h1").innerText = 2;
                      setTimeout(() => {
                        document.querySelector("h1").innerText = 1;
                        setTimeout(() => {
                          document.querySelector("h1").innerText =
                            "Happy Pongal 🔥";
                        }, 1000);
                      }, 1000);
                    }, 1000);
                  }, 1000);
                }, 1000);
              }, 1000);
            }, 1000);
          }, 1000);
        }, 1000);
      }, 1000);
    </script>
  </body>
</html>
